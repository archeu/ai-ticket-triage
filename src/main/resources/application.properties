spring.application.name=ticket-triage

# 大模型配置：全部从环境变量读取（来自 ~/.config/llm.env），Key 不写进代码
# Spring AI 2.0 用 OpenAI 官方 SDK，base URL 保留 /v1，和提供商给的格式一致
spring.ai.openai.base-url=${LLM_BASE_URL}
spring.ai.openai.api-key=${LLM_API_KEY}
spring.ai.openai.chat.options.model=${LLM_MODEL}

# 数据库：从环境变量读取（本地开发来自 ~/.config/demo-db.env，线上由 compose.yaml 传入）
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Demo 阶段让 Hibernate 自动建表；正式项目改用 Flyway 管理表结构
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 限流（防止别人刷你的 AI 额度）：每个 IP 每分钟 5 次、每天 30 次；全站每天 300 次
triage.rate-limit.per-ip-per-minute=5
triage.rate-limit.per-ip-per-day=30
triage.rate-limit.global-per-day=300

# 公开演示站的数据只保留 3 天，每小时清理一次
triage.retention-days=3

# 只有拿到邀请链接的人才能使用 AI 分析（邀请码用 scripts/invite.sh 管理）
triage.invite.required=true
