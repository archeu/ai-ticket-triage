<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Ticket Triage</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2328; --muted: #667085; --border: #e4e7ec;
    --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eef2ff;
    --high: #b42318; --high-bg: #fee4e2; --medium: #b54708; --medium-bg: #fef0c7; --low: #067647; --low-bg: #dcfae6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--border); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  main { max-width: 1080px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--high); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .banner { background: #fffaeb; border: 1px solid #fedf89; color: #93370d; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
  textarea { width: 100%; min-height: 130px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; resize: vertical; }
  textarea:disabled { background: #f9fafb; }
  textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .actions, .toolbar, .pager, .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .actions { margin-top: 10px; }
  .toolbar { margin-bottom: 8px; }
  .toolbar h2 { margin: 0 auto 0 0; }
  .pager { justify-content: flex-end; margin-top: 12px; }
  button { font: inherit; font-size: 14px; border-radius: 8px; padding: 7px 14px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--accent); }
  button.ghost:hover:not(:disabled) { background: var(--accent-soft); }
  select { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .cat { background: var(--accent-soft); color: var(--accent); }
  .tag { background: #f2f4f7; color: #475467; margin-right: 6px; }
  .u-HIGH { background: var(--high-bg); color: var(--high); }
  .u-MEDIUM { background: var(--medium-bg); color: var(--medium); }
  .u-LOW { background: var(--low-bg); color: var(--low); }
  .s-NEGATIVE { color: var(--high); } .s-POSITIVE { color: var(--low); } .s-NEUTRAL { color: var(--muted); }
  .result { margin-top: 14px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: #fafbfc; }
  .label { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .text { white-space: pre-wrap; word-break: break-word; margin: 2px 0 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 14px; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #f8fafc; }
  tr.detail td { background: #fafbfc; }
  .empty { text-align: center; color: var(--muted); padding: 24px; }
  @media (max-width: 720px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1 data-i18n="title"></h1>
      <div class="muted" data-i18n="subtitle"></div>
    </div>
    <button id="lang" class="ghost" type="button"></button>
  </div>
</header>

<main>
  <section class="card">
    <h2 data-i18n="newTicket"></h2>
    <div id="access" class="banner" hidden></div>
    <textarea id="email" maxlength="8000" disabled></textarea>
    <div class="muted" data-i18n="notice"></div>
    <div class="actions">
      <button id="analyze" type="button" data-i18n="analyze" disabled></button>
      <button id="sample" class="ghost" type="button" data-i18n="sample" disabled></button>
      <span id="status" class="muted"></span>
    </div>
    <div id="result"></div>
  </section>

  <section class="card">
    <div class="toolbar">
      <h2 data-i18n="tickets"></h2>
      <select id="fCategory" aria-label="category"></select>
      <select id="fUrgency" aria-label="urgency"></select>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th class="hide-sm" data-i18n="colTime"></th>
          <th data-i18n="colCategory"></th>
          <th data-i18n="colUrgency"></th>
          <th class="hide-sm" data-i18n="colSentiment"></th>
          <th class="hide-sm" data-i18n="colOrder"></th>
          <th data-i18n="colSummary"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager">
      <span id="pageInfo" class="muted"></span>
      <button id="prev" class="ghost" type="button" data-i18n="prev"></button>
      <button id="next" class="ghost" type="button" data-i18n="next"></button>
    </div>
  </section>
</main>

<script>
// 页面上的所有文字都在这里：切换语言 = 换一套字典
var I18N = {
  zh: {
    title: "AI 工单分类助手",
    subtitle: "粘贴客户邮件，AI 自动分类、判断紧急程度、提取订单号并起草回复",
    newTicket: "分析一封新邮件", emailPlaceholder: "在这里粘贴客户邮件……（Ctrl + Enter 直接分析）",
    analyze: "AI 分析", sample: "填入示例邮件", analyzing: "AI 分析中，通常需要几秒……",
    tickets: "工单列表", allCategories: "全部类别", allUrgencies: "全部紧急程度",
    colTime: "时间", colCategory: "类别", colUrgency: "紧急", colSentiment: "情绪", colOrder: "订单号", colSummary: "摘要",
    email: "原始邮件", reply: "回复草稿", copy: "复制回复", copied: "已复制", order: "订单号", urgencyPrefix: "紧急程度",
    sampleTag: "示例",
    empty: "还没有工单，先在上面分析一封邮件吧", prev: "上一页", next: "下一页",
    pageInfo: "第 {page} / {pages} 页，共 {total} 条", emptyEmail: "请先粘贴邮件内容", langButton: "English",
    notice: "演示环境：你提交的内容其他访客看不到，3 天后自动删除。请不要粘贴真实的个人信息。",
    inviteRequired: "这是演示页面，下面的列表里有示例结果。试用 AI 分析需要邀请链接，请联系作者获取。",
    inviteInvalid: "这个邀请链接无效或已停用，请联系作者获取新的链接。",
    errors: {
      too_many_per_minute: "请求太频繁，请一分钟后再试",
      daily_ip_quota: "你今天的试用次数已经用完，请明天再来",
      daily_global_quota: "今天的演示额度已经用完，请明天再来",
      invite_required: "需要邀请链接才能使用 AI 分析",
      invite_invalid: "邀请链接无效或已停用",
      invite_daily_limit: "这个邀请链接今天的使用次数已用完，请明天再试"
    },
    CATEGORY: { INQUIRY: "咨询", COMPLAINT: "投诉", REFUND: "退款", TECHNICAL: "技术问题", OTHER: "其他" },
    URGENCY: { HIGH: "高", MEDIUM: "中", LOW: "低" },
    SENTIMENT: { POSITIVE: "正面", NEUTRAL: "中性", NEGATIVE: "负面" }
  },
  en: {
    title: "AI Ticket Triage",
    subtitle: "Paste a customer email. AI classifies it, rates urgency, extracts the order number and drafts a reply.",
    newTicket: "Analyze a new email", emailPlaceholder: "Paste a customer email here… (Ctrl + Enter to analyze)",
    analyze: "Analyze with AI", sample: "Use a sample email", analyzing: "Analyzing, usually takes a few seconds…",
    tickets: "Tickets", allCategories: "All categories", allUrgencies: "All urgencies",
    colTime: "Time", colCategory: "Category", colUrgency: "Urgency", colSentiment: "Sentiment", colOrder: "Order #", colSummary: "Summary",
    email: "Original email", reply: "Reply draft", copy: "Copy reply", copied: "Copied", order: "Order", urgencyPrefix: "Urgency",
    sampleTag: "Sample",
    empty: "No tickets yet. Analyze an email above to get started.", prev: "Previous", next: "Next",
    pageInfo: "Page {page} of {pages} · {total} tickets", emptyEmail: "Please paste an email first", langButton: "中文",
    notice: "Demo: other visitors can't see what you submit, and it's deleted after 3 days. Please don't paste real personal data.",
    inviteRequired: "This is a demo page with sample results below. Trying the AI analysis requires an invite link. Please contact the author to get one.",
    inviteInvalid: "This invite link is invalid or has been disabled. Please contact the author for a new one.",
    errors: {
      too_many_per_minute: "Too many requests. Please try again in a minute.",
      daily_ip_quota: "You've reached today's limit for this demo. Please come back tomorrow.",
      daily_global_quota: "Today's demo quota is used up. Please come back tomorrow.",
      invite_required: "An invite link is required to use the AI analysis.",
      invite_invalid: "This invite link is invalid or has been disabled.",
      invite_daily_limit: "This invite link has reached today's limit. Please try again tomorrow."
    },
    CATEGORY: { INQUIRY: "Inquiry", COMPLAINT: "Complaint", REFUND: "Refund", TECHNICAL: "Technical", OTHER: "Other" },
    URGENCY: { HIGH: "High", MEDIUM: "Medium", LOW: "Low" },
    SENTIMENT: { POSITIVE: "Positive", NEUTRAL: "Neutral", NEGATIVE: "Negative" }
  }
};

// "填入示例邮件"按钮用的邮件，按界面语言轮流填入
var SAMPLES = {
  zh: [
    "你好，我上周五下单的蓝牙耳机（订单号 A20261028）现在到哪里了？大概什么时候能送到曼谷？",
    "收到的电饭煲外壳有裂缝，用了一次就漏水，太失望了。我要求全额退款，订单号 B88123。",
    "我在 App 上付款时一直提示“支付失败，请稍后再试”，试了三张卡都不行，但钱好像已经扣了。"
  ],
  en: [
    "This is the second time the shoes arrived in the wrong size. Really frustrating. Please just send me a return label and refund my money. Order #C5521.",
    "Hi, I haven't been able to log in since yesterday and the password reset email never arrives. I need to track my order D7781 urgently. Please help.",
    "Hello, do you ship to Singapore? I'd like to order two of the ceramic mugs from your homepage before Christmas."
  ]
};

// 浏览器本地存储：隐私模式下可能不可用，读写失败就当没有
var STORE = {
  get: function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set: function (key, value) { try { localStorage.setItem(key, value); } catch (e) { /* 忽略 */ } }
};

var state = {
  lang: detectLang(), page: 0, size: 10, sampleIndex: 0, data: null,
  visitorId: getVisitorId(), invite: takeInviteFromUrl(), access: null
};

function detectLang() {
  var saved = STORE.get("lang");
  if (saved === "zh" || saved === "en") return saved;
  return (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
}

// 访客 ID：每个浏览器随机生成一个，只用来区分"自己提交的工单"
function getVisitorId() {
  var id = STORE.get("visitorId");
  if (!id) {
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : randomHex(16);
    STORE.set("visitorId", id);
  }
  return id;
}

function randomHex(bytes) {
  var values = new Uint8Array(bytes);
  crypto.getRandomValues(values);
  return Array.prototype.map.call(values, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
}

// 邀请码：从链接里的 ?invite=xxx 读出来存好，再从地址栏去掉，避免截图或转发时泄露
function takeInviteFromUrl() {
  var params = new URLSearchParams(location.search);
  var code = params.get("invite");
  if (code) {
    STORE.set("invite", code);
    params.delete("invite");
    var rest = params.toString();
    history.replaceState(null, "", location.pathname + (rest ? "?" + rest : ""));
  }
  return code || STORE.get("invite");
}

function apiHeaders(extra) {
  var headers = { "X-Visitor-Id": state.visitorId };
  if (state.invite) headers["X-Invite-Code"] = state.invite;
  Object.keys(extra || {}).forEach(function (k) { headers[k] = extra[k]; });
  return headers;
}

function t(key) { return I18N[state.lang][key]; }

function fmt(template, values) {
  return template.replace(/\{(\w+)\}/g, function (_, k) { return values[k]; });
}

// 安全地创建元素：文字一律用 textContent，不用 innerHTML。
// 邮件和 AI 输出都是外部内容，用 innerHTML 可能让里面的代码被执行（XSS 攻击）。
function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function badge(kind, value) {
  if (kind === "category") return el("span", "badge cat", t("CATEGORY")[value] || value);
  if (kind === "urgency") return el("span", "badge u-" + value, t("URGENCY")[value] || value);
  return el("span", "s-" + value, t("SENTIMENT")[value] || value);
}

function formatTime(iso) {
  return new Date(iso).toLocaleString(state.lang === "zh" ? "zh-CN" : "en-US",
    { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function copyText(text, button) {
  var done = function () {
    button.textContent = t("copied");
    setTimeout(function () { button.textContent = t("copy"); }, 1500);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done);
    return;
  }
  // 没有 HTTPS 时浏览器不给用剪贴板接口，用老办法兜底
  var area = document.createElement("textarea");
  area.value = text;
  document.body.appendChild(area);
  area.select();
  try { document.execCommand("copy"); done(); } finally { document.body.removeChild(area); }
}

function detailBlock(ticket, withEmail) {
  var box = el("div");
  if (withEmail) {
    box.appendChild(el("div", "label", t("email")));
    box.appendChild(el("p", "text", ticket.email));
  }
  box.appendChild(el("div", "label", t("reply")));
  box.appendChild(el("p", "text", ticket.replyDraft));
  var copy = el("button", "ghost", t("copy"));
  copy.type = "button";
  copy.style.marginTop = "8px";
  copy.addEventListener("click", function (e) {
    e.stopPropagation(); // 不要触发整行的展开/收起
    copyText(ticket.replyDraft || "", copy);
  });
  box.appendChild(copy);
  return box;
}

function renderResult(ticket) {
  var box = document.getElementById("result");
  box.textContent = "";
  var card = el("div", "result");
  var meta = el("div", "meta");
  meta.appendChild(el("strong", null, "#" + ticket.id));
  meta.appendChild(badge("category", ticket.category));
  var urgency = badge("urgency", ticket.urgency);
  urgency.textContent = t("urgencyPrefix") + " " + urgency.textContent;
  meta.appendChild(urgency);
  meta.appendChild(badge("sentiment", ticket.sentiment));
  if (ticket.orderNumber) meta.appendChild(el("span", "muted", t("order") + " " + ticket.orderNumber));
  card.appendChild(meta);
  card.appendChild(el("p", "text", ticket.summary));
  card.appendChild(detailBlock(ticket, false));
  box.appendChild(card);
}

function renderRows() {
  var body = document.getElementById("rows");
  body.textContent = "";
  var data = state.data;
  if (!data || data.items.length === 0) {
    var emptyRow = el("tr");
    var cell = el("td", "empty", t("empty"));
    cell.colSpan = 7;
    emptyRow.appendChild(cell);
    body.appendChild(emptyRow);
  } else {
    data.items.forEach(function (ticket) {
      var row = el("tr", "row");
      row.appendChild(el("td", null, String(ticket.id)));
      row.appendChild(el("td", "hide-sm", formatTime(ticket.createdAt)));
      var c = el("td"); c.appendChild(badge("category", ticket.category)); row.appendChild(c);
      var u = el("td"); u.appendChild(badge("urgency", ticket.urgency)); row.appendChild(u);
      var s = el("td", "hide-sm"); s.appendChild(badge("sentiment", ticket.sentiment)); row.appendChild(s);
      row.appendChild(el("td", "hide-sm", ticket.orderNumber || "—"));
      var summary = el("td");
      if (ticket.sample) summary.appendChild(el("span", "badge tag", t("sampleTag")));
      summary.appendChild(document.createTextNode(ticket.summary || ""));
      row.appendChild(summary);

      var detail = el("tr", "detail");
      detail.hidden = true;
      var detailCell = el("td");
      detailCell.colSpan = 7;
      detailCell.appendChild(detailBlock(ticket, true));
      detail.appendChild(detailCell);

      row.addEventListener("click", function () { detail.hidden = !detail.hidden; });
      body.appendChild(row);
      body.appendChild(detail);
    });
  }
  var pages = data ? Math.max(data.totalPages, 1) : 1;
  document.getElementById("pageInfo").textContent =
    data ? fmt(t("pageInfo"), { page: data.page + 1, pages: pages, total: data.total }) : "";
  document.getElementById("prev").disabled = !data || data.page <= 0;
  document.getElementById("next").disabled = !data || data.page + 1 >= data.totalPages;
}

// 根据邀请码状态决定：能不能输入、要不要显示提示
function renderAccess() {
  var access = state.access;
  var allowed = !!access && (!access.required || access.valid);
  var banner = document.getElementById("access");
  if (access && !allowed) {
    banner.textContent = state.invite ? t("inviteInvalid") : t("inviteRequired");
    banner.hidden = false;
  } else {
    banner.hidden = true;
  }
  document.getElementById("email").disabled = !allowed;
  document.getElementById("analyze").disabled = !allowed;
  document.getElementById("sample").disabled = !allowed;
}

function checkAccess() {
  return fetch("/api/access", { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .catch(function () { return { required: true, valid: false }; })
    .then(function (access) { state.access = access; renderAccess(); });
}

function loadTickets() {
  var params = new URLSearchParams({ page: state.page, size: state.size, lang: state.lang });
  var category = document.getElementById("fCategory").value;
  var urgency = document.getElementById("fUrgency").value;
  if (category) params.set("category", category);
  if (urgency) params.set("urgency", urgency);
  return fetch("/api/tickets?" + params, { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (data) { state.data = data; renderRows(); });
}

function analyze() {
  var email = document.getElementById("email").value.trim();
  var status = document.getElementById("status");
  var button = document.getElementById("analyze");
  status.className = "muted";
  if (button.disabled) return;
  if (!email) {
    status.textContent = t("emptyEmail");
    status.className = "error";
    return;
  }
  button.disabled = true;
  status.textContent = t("analyzing");
  fetch("/api/tickets", {
    method: "POST",
    headers: apiHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ email: email, summaryLanguage: state.lang })
  })
    .then(function (r) {
      return r.json().then(function (body) {
        // 限流、邀请码等错误：有 code 就显示当前语言的提示，没有就显示后端给的原因
        if (!r.ok) {
          var error = new Error((body.code && t("errors")[body.code]) || body.error || ("HTTP " + r.status));
          error.code = body.code;
          throw error;
        }
        return body;
      });
    })
    .then(function (ticket) {
      status.textContent = "";
      renderResult(ticket);
      state.page = 0;
      return loadTickets();
    })
    .catch(function (e) {
      status.textContent = e.message;
      status.className = "error";
      if (e.code === "invite_invalid" || e.code === "invite_required") return checkAccess();
    })
    .then(renderAccess);
}

function fillSelect(id, allKey, dict) {
  var select = document.getElementById(id);
  var current = select.value;
  select.textContent = "";
  var all = el("option", null, t(allKey));
  all.value = "";
  select.appendChild(all);
  Object.keys(dict).forEach(function (key) {
    var option = el("option", null, dict[key]);
    option.value = key;
    select.appendChild(option);
  });
  select.value = current;
}

function applyLang() {
  document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(function (node) {
    node.textContent = t(node.getAttribute("data-i18n"));
  });
  document.getElementById("email").placeholder = t("emailPlaceholder");
  document.getElementById("lang").textContent = t("langButton");
  fillSelect("fCategory", "allCategories", t("CATEGORY"));
  fillSelect("fUrgency", "allUrgencies", t("URGENCY"));
  renderAccess();
  renderRows();
}

document.getElementById("lang").addEventListener("click", function () {
  state.lang = state.lang === "zh" ? "en" : "zh";
  STORE.set("lang", state.lang);
  applyLang();
  state.page = 0;
  loadTickets(); // 示例按语言显示，切换后重新加载
});
document.getElementById("analyze").addEventListener("click", analyze);
document.getElementById("email").addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") analyze();
});
document.getElementById("sample").addEventListener("click", function () {
  var list = SAMPLES[state.lang];
  document.getElementById("email").value = list[state.sampleIndex % list.length];
  state.sampleIndex++;
});
["fCategory", "fUrgency"].forEach(function (id) {
  document.getElementById(id).addEventListener("change", function () { state.page = 0; loadTickets(); });
});
document.getElementById("prev").addEventListener("click", function () { state.page--; loadTickets(); });
document.getElementById("next").addEventListener("click", function () { state.page++; loadTickets(); });

applyLang();
checkAccess();
loadTickets();
</script>
</body>
</html>
