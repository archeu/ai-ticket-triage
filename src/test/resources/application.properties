# 测试配置（会完全替代 src/main/resources/application.properties）
# 假的大模型配置：测试里 AI 被替换成假对象，不会真的调用大模型
spring.ai.openai.base-url=http://localhost:9/v1
spring.ai.openai.api-key=test-key
spring.ai.openai.chat.options.model=test-model

# 数据库：不配置连接地址，Spring Boot 会自动启动一个 H2 内存数据库（每个测试上下文一个，互不干扰）
spring.jpa.open-in-view=false

# 测试用的限流、清理和邀请码配置；个别测试类会用 @SpringBootTest(properties=...) 覆盖
triage.rate-limit.per-ip-per-minute=5
triage.rate-limit.per-ip-per-day=30
triage.rate-limit.global-per-day=300
triage.retention-days=0
triage.invite.required=false
